# dpkg, dpkg-query and apt read this file before their command line.
# One long option per line, without the two leading dashes (see dpkg(1)).
# Files in /etc/dpkg/dpkg.cfg.d/ are read first, in name order.

# Where Debian packages are installed. /debian keeps them apart from UC.OS's
# own /bin, /etc and /usr (docs/DECISIONS.md). apt keeps its state there too
# (/debian/etc/apt, /debian/var/lib/apt, /debian/var/lib/dpkg).
root /debian

# The architecture packages are built for. The built-in default is riscv64,
# the guest architecture of the Linux binary engine (lx runs Debian 13 riscv64).
#native-architecture riscv64

# Maintainer scripts must run inside the package root, which takes the binary
# engine. Until it exists, either run them with UC.OS's own shell:
#force-script-chrootless
# or treat a script that cannot run as done (it is recorded in
# /debian/var/lib/dpkg/info/PACKAGE.unrun):
#force-unrunnable-scripts

# A program that can run the root's own binaries, for maintainer scripts.
# %r is replaced by the root. Meant for the binary engine.
#script-runner /bin/ENGINE --root %r

# Leave out documentation, manual pages and translations to save memory.
#path-exclude /usr/share/doc/*
#path-include /usr/share/doc/*/copyright
#path-exclude /usr/share/man/*
#path-exclude /usr/share/locale/*
